[project]
name = "announcer"
version = "6.0.1"
description = "Announce changes in keepachangelog-style CHANGELOG.md files to Slack and Microsoft Teams"
authors = [{ name = "Max Dymond", email = "max.dymond@alianza.com" }]
requires-python = ">=3.10,<4.0.0"
readme = "README.md"
license = {file = "LICENSE.md"}
keywords = [
    "slack",
    "teams",
]
dependencies = [
    "requests (>=2.19,<3.0)",
    "mistletoe (>=1,<2)",
]

[project.scripts]
announce = "announcer.__init__:main"

[dependency-groups]
dev = [
    "wheel==0.46.3",
    "mypy==1.20.0",
    "pytest==8.4.2",
    "werkzeug==3.1.8",
    "pytest-httpserver==1.1.5",
    "tox==4.52.0",
    "pytest-cov==7.1.0",
    "types-requests>=2.32.0,<3",
    "ruff>=0.15.8,<0.16.0",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[tool.mypy]
python_version = "3.10"
files = ["src/announcer", "tests"]
